description: >
  Tag a multi-platform image that is already in a registry, by digest, without pulling or pushing it.
  The tag and push commands handle one platform, so they would flatten a multi-platform index.
  juburr/crane-orb installs crane, checked against a SHA-512 built into that orb, and logs in to the registry.

usage:
  version: 2.1

  orbs:
    crane: juburr/crane-orb@0.2.1
    tagger: juburr/container-tagger-orb@1.1.1

  jobs:
    promote:
      docker:
        - image: cimg/base:current-22.04
      steps:
        - checkout
        - crane/install:
            version: "0.22.1"
        - crane/login:
            registry: ghcr.io
            username: GITHUB_USER
            password: GITHUB_TOKEN
        - tagger/generate_tags:
            tags_file: tags.txt
        - tagger/tag_digest:
            image_digest_ref: ghcr.io/org/repo/image@${BUILD_DIGEST}
            tags_file: tags.txt

  workflows:
    release:
      jobs:
        - promote:
            context:
              - yourproject-github-pkg-rw
