description: >
  Populates an environment variable with the most specific tag.
parameters:
  package:
    type: string
    default: ""
    description: "Optional tag prefix, such as those used in Go monorepos."
  source_tag:
    type: string
    default: ""
    description: >
      Optional release tag to use instead of CIRCLE_TAG, for releases that do not run from a tag pipeline, for example ${RELEASE_TAG}.
      Same rules as generate_tags: when set, it is the only release identity, it must equal CIRCLE_TAG when CIRCLE_TAG is set,
      and there is no fallback to sha tags. Leave empty to use CIRCLE_TAG and CIRCLE_BRANCH.
  tag_env_var:
    type: env_var_name
    default: "TAG"
    description: "Environment variable to populate the most specific tag with."
steps:
  - run:
      environment:
        PARAM_PACKAGE: << parameters.package >>
        PARAM_SOURCE_TAG: << parameters.source_tag >>
        PARAM_TAG_ENV_VAR: << parameters.tag_env_var >>
      name: Populate Tag Environment Variable
      shell: /bin/bash
      command: <<include(scripts/populate_tag.sh)>>
