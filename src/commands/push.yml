description: >
  Pushes container images to a registry using a tags file. Each tag is pushed from the local container tool,
  which holds one platform. For a multi-platform image already in a registry, use tag_digest instead.
parameters:
  tags_file:
    type: string
    default: tags.txt
    description: "Path of the file with the tags to apply, one per line, as written by generate_tags. A leading ~/ is expanded to $HOME."
  target_image:
    type: string
    description: "The target image name."
  tool:
    type: enum
    enum: ["buildah", "docker", "podman"]
    default: docker
    description: "Container tool to use."
steps:
  - run:
      environment:
        PARAM_TAGS_FILE: << parameters.tags_file >>
        PARAM_TARGET_IMAGE: << parameters.target_image >>
        PARAM_TOOL: << parameters.tool >>
      name: Push Tagged Images To Registry
      shell: /bin/bash
      command: <<include(scripts/push.sh)>>
