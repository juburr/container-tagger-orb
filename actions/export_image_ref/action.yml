name: Export a container image reference
description: >
  Exports an image reference, <image>:<tag>, to an environment variable for
  later steps in the job. The tag is read from the variable that export_tag
  wrote, so run export_tag first. The GitHub Actions twin of the orb's
  export_image_ref command.
author: juburr

inputs:
  image:
    description: Image repository without a tag, for example ghcr.io/org/app.
    required: true
  image_ref_env_var:
    description: >
      Output: name of the environment variable to write the image reference
      to, for example IMAGE_REF=ghcr.io/org/app:1.2.3. Later steps in the job
      can read it. export_image_digest_ref reads it.
    default: IMAGE_REF
  tag_env_var:
    description: >
      Input: name of the environment variable that already holds the tag, as
      written by export_tag.
    default: TAG

runs:
  using: composite
  steps:
    - name: Export Image Reference Environment Variable
      shell: bash
      env:
        PARAM_IMAGE: ${{ inputs.image }}
        PARAM_IMAGE_REF_ENV_VAR: ${{ inputs.image_ref_env_var }}
        PARAM_TAG_ENV_VAR: ${{ inputs.tag_env_var }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/export_image_ref.sh"
