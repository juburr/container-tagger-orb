version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  container-tagger-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - container-tagger-orb/generate_tags
      - setup_remote_docker:
          docker_layer_caching: true
      - container-tagger-orb/tag:
          source_image: gcr.io/distroless/static:latest
          target_image: mydistroless
      - run:
          name: Verify Target Tags Exist
          command: |
            while read -r INTAG; do
              docker image ls mydistroless:$INTAG | grep -v REPOSITORY
            done < tags.txt
      - container-tagger-orb/populate_tag
      - run:
          name: Verify Environment Variables
          command: |
            if [[ -z $TAG ]]; then
              echo "Expected TAG to be set, but it was not."
              exit 1
            fi
            echo "The TAG environment variable was set: ${TAG}"
      - container-tagger-orb/populate_image_uri:
          image: gcr.io/distroless/static
      - run:
          name: Verify Environment Variables
          command: |
            if [[ -z $IMAGE_URI ]]; then
              echo "Expected IMAGE_URI to be set, but it was not."
              exit 1
            fi
            echo "The IMAGE_URI environment variable was set: ${IMAGE_URI}"
      - run:
          name: Setup Digest Test
          command: |
            echo "export TAG=latest" >> ${BASH_ENV}
            echo "export IMAGE_URI=gcr.io/distroless/static:latest" >> ${BASH_ENV}
      - container-tagger-orb/populate_image_uri_digest
      - run:
          name: Verify Environment Variables
          command: |
            if [[ ! "${IMAGE_URI_DIGEST}" =~ ^gcr.io/distroless/static@sha256:[0-9a-f]{64}$ ]]; then
              echo "Expected gcr.io/distroless/static@sha256:<64 hex>, got: ${IMAGE_URI_DIGEST}"
              exit 1
            fi
            echo "The IMAGE_URI_DIGEST environment variable was set: ${IMAGE_URI_DIGEST}"
      - run:
          name: Setup Source Tag Test
          # On a tag pipeline, CIRCLE_TAG would rightly conflict with this fixed
          # source_tag. Clear it for the remaining steps so branch and tag
          # pipelines run the same check.
          command: |
            echo "export RELEASE_TAG=v9.8.7-rc.1" >> "${BASH_ENV}"
            echo "export CIRCLE_TAG=" >> "${BASH_ENV}"
      - container-tagger-orb/generate_tags:
          outfile: source-tags.txt
          source_tag: ${RELEASE_TAG}
      - container-tagger-orb/populate_tag:
          source_tag: ${RELEASE_TAG}
          tag_env_var: SOURCE_TAG_RESULT
      - run:
          name: Verify Source Tag Results
          command: |
            if [[ "$(cat source-tags.txt)" != "9.8.7-rc.1" ]]; then
              echo "Expected only 9.8.7-rc.1 in source-tags.txt, got:"
              cat source-tags.txt
              exit 1
            fi
            if [[ "${SOURCE_TAG_RESULT}" != "9.8.7-rc.1" ]]; then
              echo "Expected SOURCE_TAG_RESULT=9.8.7-rc.1, got: ${SOURCE_TAG_RESULT}"
              exit 1
            fi
            echo "source_tag produced the exact pre-release tag only."
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/container-tagger-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
          context: orb-publishing
          filters: *release-filters
