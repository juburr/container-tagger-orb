version: 2.1
setup: true
orbs:
  crane: juburr/crane-orb@0.1.0
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash test/env_subst_test.sh
      - run:
          name: Run shell conventions test
          command: bash test/shell_conventions_test.sh
  test-tag-selection:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run tag selection tests
          command: bash test/generate_tags_test.sh
  test-image-refs:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run image reference tests
          command: bash test/export_image_ref_test.sh
      - run:
          name: Run image digest reference tests
          command: bash test/export_image_digest_ref_test.sh
  test-tag:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run tag tool tests
          command: bash test/tag_test.sh
  test-tilde-paths:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run ~ path expansion tests
          command: bash test/tilde_test.sh
  test-actions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Check the GitHub Actions against the orb's commands
          command: bash test/actions_test.sh
      - run:
          name: Run the command scripts without the CircleCI CLI, as the actions do
          command: bash test/commands_test.sh
  test-tag-digest:
    docker:
      - image: cimg/base:current
      # registry:2 at localhost:5000, for copying a multi-platform index by digest.
      - image: registry:2.8.3
    steps:
      - checkout
      - run:
          name: Run tag_digest tests
          command: bash test/tag_digest_test.sh
      - crane/install:
          version: "0.22.1"
      - run:
          name: Wait for registry
          command: |
            for _ in $(seq 1 30); do
              if curl -fsS http://localhost:5000/v2/ > /dev/null; then
                exit 0
              fi
              sleep 1
            done
            echo "registry:2 did not start on localhost:5000"
            exit 1
      - run:
          name: Run tag_digest registry test
          command: bash test/tag_digest_registry_test.sh

workflows:
  lint-pack:
    jobs:
      - test-env-subst:
          filters: *filters
      - test-tag-selection:
          filters: *filters
      - test-image-refs:
          filters: *filters
      - test-tag:
          filters: *filters
      - test-tilde-paths:
          filters: *filters
      - test-tag-digest:
          filters: *filters
      - test-actions:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: tagger
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: container-tagger-orb
          requires: [test-env-subst, test-tag-selection, test-image-refs, test-tag, test-tilde-paths, test-tag-digest, test-actions, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
